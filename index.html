
<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Smart Scan AI</title>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f0f7f2;
      text-align: center;
      padding: 20px;
      color: #234;
    }
    .container {
      max-width: 500px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 16px;
    }
    h2 { color: #16834a; }
    button {
      background: #16834a;
      color: white;
      border: 0;
      border-radius: 10px;
      padding: 13px 20px;
      margin: 8px;
      font-size: 16px;
    }
    #reader { width: 100%; margin-top: 15px; }
    #message { margin-top: 15px; font-weight: bold; }
  </style>
</head>
<body>
  <div class="container">
    <h2>Smart Scan AI</h2>
    <p>ระบบสแกน QR Code นักเรียน</p>
    <button onclick="startScanner()">เปิดกล้องสแกน QR</button>
    <button onclick="stopScanner()">ปิดกล้อง</button>
    <div id="reader"></div>
    <p id="message">พร้อมใช้งาน</p>
  </div>

  <script>
    let scanner = null;
    let running = false;
const APP_SCRIPT_URL =
"https://script.google.com/a/macros/thepbodint.ac.th/s/AKfycbzk-QJm0jj5UHBZ4dbscjRZD8Mn7r087f8Im0ZI8L7AWj1faHfylK_4Xp_FrD9Of189rw/exec";

const scanToken =
new URLSearchParams(window.location.search).get("token") || "";
    alert("TOKEN ที่ได้รับ = " + scanToken);
    async function startScanner() {
      const message = document.getElementById("message");

      try {
        if (typeof Html5Qrcode === "undefined") {
          throw new Error("โหลดระบบอ่าน QR ไม่สำเร็จ");
        }

        if (!scanner) {
          scanner = new Html5Qrcode("reader");
        }

        if (running) return;

        message.textContent = "กำลังเปิดกล้อง...";

        await scanner.start(
          { facingMode: "environment" },
          {
            fps: 10,
            qrbox: { width: 230, height: 230 }
          },

async function(decodedText) {
  message.textContent = "กำลังอ่านรหัสนักเรียน...";

  if (scanner && running) {
    await scanner.stop();
    running = false;
  }

  message.textContent = "อ่าน QR สำเร็จ: " + decodedText;
  
console.log("SMART SCAN TOKEN:", scanToken);
console.log("QR STUDENT ID:", decodedText);
  if (!scanToken) {
    message.textContent =
      "อ่าน QR สำเร็จ: " + decodedText +
      " แต่ยังไม่มีรหัสเชื่อมต่อ";
    return;
  }

  const sendUrl =
    APP_SCRIPT_URL +
    "?page=saveScan" +
    "&token=" + encodeURIComponent(scanToken) +
    "&studentId=" + encodeURIComponent(decodedText);
alert("URL ที่กำลังส่ง:\n" + sendUrl);
  try {
    await fetch(sendUrl, {
      method: "GET",
      mode: "no-cors"
    });

    message.textContent =
      "อ่าน QR สำเร็จ: " + decodedText +
      " กำลังส่งข้อมูลเข้าสู่ระบบ";
  } catch (error) {
    message.textContent =
      "อ่าน QR สำเร็จ แต่ส่งข้อมูลไม่สำเร็จ";
  }
},

          function() {}
        );

        running = true;
        message.textContent = "เปิดกล้องสำเร็จ กรุณาสแกน QR Code";

      } catch (error) {
        message.textContent =
          "เปิดกล้องไม่สำเร็จ: " +
          error.name + " / " + error.message;
      }
    }

    async function stopScanner() {
      if (scanner && running) {
        await scanner.stop();
        running = false;
        document.getElementById("message").textContent = "ปิดกล้องแล้ว";
      }
    }
  </script>
</body>
</html>
